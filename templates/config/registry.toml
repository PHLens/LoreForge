# LoreForge local wiki registry
#
# Copy this file to:
#   ~/.config/loreforge/registry.toml
#
# The registry is machine-local. It tells agents where wiki instances live.
# Actual professional knowledge belongs in the wiki repos, not in this config.

default = "cs"

[[wikis]]
name = "cs"
path = "/path/to/cs-wiki"
remote = "git@github.com:OWNER/cs-wiki.git"
description = "Computer science, GPU, ML systems, PyTorch"
default_view = "query"

[[wikis]]
name = "example"
path = "/path/to/example-wiki"
remote = "git@github.com:OWNER/example-wiki.git"
description = "Example LoreForge wiki instance"
default_view = "default"
