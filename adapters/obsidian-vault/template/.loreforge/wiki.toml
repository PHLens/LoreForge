# LoreForge Obsidian vault metadata

schema_version = "0.1"
name = "obsidian-vault"
description = "LoreForge-compatible Obsidian vault using MOCs/Scope conventions"

agents_file = "AGENTS.md"
vault_map = "MOCs/Scope/+Vault Guide.md"
schema_file = "MOCs/Scope/+Vault Guide.md"
index_file = "MOCs/Scope/+Wiki Index.md"
log_file = "MOCs/Scope/+Wiki Log.md"
views_dir = "MOCs/Scope"
default_view = "query"

[views]
default = "MOCs/Scope/+Vault Guide.md"
query = "MOCs/Scope/+Vault Guide.md"
ingest = "MOCs/Scope/+Agent Workflow.md"
writeback = "MOCs/Scope/+Agent Workflow.md"
promote = "MOCs/Scope/+Agent Workflow.md"
maintenance = "MOCs/Scope/+Agent Workflow.md"

[paths]
inbox = "10_Inbox"
capture = "10_Inbox/capture"
ingest = "10_Inbox/ingest"
writeback = "10_Inbox/writeback"
cards = "Cards"
sources = "Sources"
mocs = "MOCs"
archive = "Archive"
